# PlateResort Configuration
resort:
  # Hardware settings
  device: "/dev/ttyUSB0"
  baudrate: 57600
  motor_id: 1
  
  # Physical layout
  hotels: ["A", "B", "C", "D"]
  rooms_per_hotel: 20
  
  # Positioning
  offset_angle: 19  # Base offset angle in degrees
  rotation_direction: 1  # 1 for clockwise, -1 for counter-clockwise
  
  # Hotel positions computed dynamically:
  # angle_i = offset_angle + i * (360 / len(hotels)) * rotation_direction
  
  # Movement settings
  default_speed: 17  # Profile Velocity register (0.229 rpm/unit; 17 ≈ 3.9 rpm ≈ 23 °/s — full rotation ≈ 15 s). Shapes the trajectory only — does NOT limit torque.
  max_speed: 17      # Upper bound accepted by set_speed()/config (17 keeps a full rotation at ≈ 15 s or slower). Values < 1 are always rejected: Profile Velocity 0 means NO velocity profile (unlimited-speed move), not slow.
  position_tolerance: 0.5  # Position accuracy in degrees
  movement_timeout: 20  # Max wait time in seconds
  profile_acceleration: 10  # Profile Acceleration register (214.577 rev/min²/unit; 10 ≈ 215 °/s²). 0 = infinite (step); gentle ramp reduces stick-slip on a heavy carousel.

  # Closed-loop control (servo-internal PID does the work; host only verifies)
  operating_mode: 5        # 5 = current-based position control (multi-turn, torque capped by goal_current_ma); 3 = plain single-turn position mode
  position_p_gain: 800     # Firmware default 800
  position_i_gain: 300     # Firmware default is 0 — non-zero I removes the load-induced steady-state error (undershoot). Increase until droop is gone; if it oscillates/overshoots, raise position_d_gain or lower I. Firmware anti-windup is built in.
  position_d_gain: 0       # Add damping if the integral term causes overshoot (try 100-500)
  feedforward_1st_gain: 0  # Velocity feedforward: cuts tracking lag during the move (does not affect final accuracy)
  feedforward_2nd_gain: 0  # Acceleration feedforward
  goal_current_ma: 2000    # Torque cap in mode 5 (mA). Must exceed the load's breakaway torque or moves will stall short by design. XM430-W210 stall ≈ 2300 mA @ 12 V; register ceiling ≈ 3209 mA.
  # current_limit_register_ma: 3200  # Optional: write the Current Limit EEPROM register (mA). Unset = keep factory limit.

  # Settle verification (host-side)
  settle_polls: 3           # Consecutive in-tolerance polls to declare success
  settle_poll_interval: 0.05  # Seconds between polls
  multi_turn_clear_revs: 2.0  # Reset the multi-turn counter after settling beyond this many accumulated revolutions

  # Health monitoring
  temperature_limit: 70  # Temperature warning threshold (°C)
  current_limit: 2000  # Current warning threshold (mA)
  voltage_min: 10.0  # Minimum voltage warning (V)
  voltage_max: 14.0  # Maximum voltage warning (V)

# Prefect Configuration
prefect:
  # Workflow settings
  server_host: "0.0.0.0"
  server_port: 4200
  
  # Work pool settings
  # Default value kept for backward compatibility. You can override at runtime
  # by setting the PLATE_RESORT_POOL environment variable.
  work_pool_name: "plate-resort-pool"
  worker_name: "plate-resort-worker"
  
  # Flow settings
  default_retries: 3
  retry_delay_seconds: 5

# REST API Server Configuration
server:
  # Network settings
  host: "0.0.0.0"  # Bind to all interfaces
  port: 8000
  
  # Security
  api_key: "changeme"  # Generate secure key with: plate-resort-keygen --generate
  # API key can be overridden with PLATE_API_KEY environment variable
  # For deployment: Set PLATE_API_KEY environment variable or run plate-resort-keygen
  
  # API settings
  reload: false  # Enable auto-reload during development
  docs_enabled: true  # Enable /docs endpoint